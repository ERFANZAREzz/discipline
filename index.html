</style></head><body><div id="authGate"><div class="authBox"><h2>دیسپلین شخصی</h2><p>برای همگام‌سازی تیک‌ها و یادداشت‌ها، با همان حساب Supabase که ساختی وارد شو. اطلاعاتت از طریق حساب خودت ذخیره می‌شود.</p><form id="authForm"><input id="authEmail" type="email" autocomplete="username" placeholder="ایمیل حساب" required><input id="authPassword" type="password" autocomplete="current-password" placeholder="رمز عبور" required><button id="authSubmit" type="submit">ورود و همگام‌سازی</button></form><div id="authMsg"></div></div></div><div id="cloudBar"><span id="cloudStatus">در انتظار اتصال امن…</span><button id="signOutBtn" type="button" hidden>خروج از حساب</button></div><div class="aur a1"></div><div class="aur a2"></div><canvas id="stars"></canvas><div class="glow" id="glow"></div><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://jerrzygmjkoetlkibovy.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_0xeo6GUflAO0FsiLFksagg_zeGuQ-YP';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let cloudUser=null,cloudRowId=null,cloudTimer=null,cloudReady=false,cloudBusy=false;
const cloudStatus=t=>{const el=document.getElementById('cloudStatus');if(el)el.textContent=t};
function cloudScheduleSave(){if(!cloudReady||!cloudUser)return;clearTimeout(cloudTimer);cloudStatus('تغییرات ذخیره‌نشده…');cloudTimer=setTimeout(cloudSaveNow,900)}
async function cloudSaveNow(){if(!cloudReady||!cloudUser||cloudBusy)return;cloudBusy=true;try{const payload={disc_v1:data,disc_notes:notes||{}};const day=new Date();const record_date=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;let result;if(cloudRowId){result=await sb.from('daily_records').update({data:payload,record_date}).eq('id',cloudRowId).select('id').single()}else{result=await sb.from('daily_records').insert({user_id:cloudUser.id,data:payload,record_date}).select('id').single()}if(result.error)throw result.error;cloudRowId=result.data.id;cloudStatus('همگام‌سازی شد ✓')}catch(e){cloudStatus('خطا در ذخیره ابری: '+(e.message||'بررسی دسترسی جدول'))}finally{cloudBusy=false}}
async function startCloudSession(session){if(!session){cloudUser=null;cloudReady=false;document.getElementById('authGate').hidden=false;document.getElementById('signOutBtn').hidden=true;cloudStatus('برای همگام‌سازی وارد شو');return}cloudUser=session.user;document.getElementById('authGate').hidden=true;document.getElementById('signOutBtn').hidden=false;cloudStatus('در حال دریافت اطلاعات…');try{const r=await sb.from('daily_records').select('id,data,created_at').eq('user_id',cloudUser.id).order('created_at',{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;if(r.data){cloudRowId=r.data.id;const v=r.data.data||{};if(v.disc_v1&&typeof v.disc_v1==='object')data=v.disc_v1;if(v.disc_notes&&typeof v.disc_notes==='object')notes=v.disc_notes;localStorage.setItem('disc_v1',JSON.stringify(data));localStorage.setItem('disc_notes',JSON.stringify(notes||{}));cloudReady=true;render();cloudStatus('اطلاعات ابری بارگذاری شد ✓')}else{cloudRowId=null;cloudReady=true;await cloudSaveNow();cloudStatus('همگام‌سازی فعال شد ✓')} }catch(e){cloudReady=false;cloudStatus('اتصال برقرار نشد: '+(e.message||'تنظیمات جدول را بررسی کن'));document.getElementById('authGate').hidden=false;document.getElementById('authMsg').textContent='ورود انجام شد اما دریافت/ذخیره اطلاعات مشکل دارد. متن خطا: '+(e.message||'خطای نامشخص')}}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('authSubmit'),msg=document.getElementById('authMsg');b.disabled=true;b.textContent='در حال ورود…';msg.textContent='';try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPassword').value});if(error)throw error;await startCloudSession(data.session)}catch(err){msg.textContent=err.message||'ورود ناموفق بود'}finally{b.disabled=false;b.textContent='ورود و همگام‌سازی'}});document.getElementById('signOutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});sb.auth.getSession().then(({data,error})=>{if(error){cloudStatus('خطای دریافت نشست حساب');return}startCloudSession(data.session)});sb.auth.onAuthStateChange((_event,session)=>{if(session)startCloudSession(session)});});
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WN=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const S=[
{id:'ex',d:'ورزش',q:'امروز ورزش کردی؟',c:'#16a34a',rest:[5,6]},
{id:'w1',d:'آب',q:'بطری اول آب را خوردی؟',c:'#f472b6'},
{id:'w2',d:'آب',q:'بطری دوم آب را خوردی؟',c:'#38bdf8'},
{id:'b1',d:'مرتب کردن تخت',q:'تخت را صبح مرتب کردی؟',c:'#facc15'},
{id:'b2',d:'مرتب کردن تخت',q:'تخت را بعدازظهر مرتب کردی؟',c:'#a16207'},
{id:'wk',d:'پیاده‌روی',q:'۳۰ دقیقه پیاده‌روی صبح را انجام دادی؟',c:'#ef4444'},
{id:'hd',d:'کارهای سخت',q:'همه کارهای سخت امروز را تا پایان روز تمام کردی؟',c:'#39ff14'},
{id:'sl',d:'خواب',q:'ساعت ۱۲ خوابیدی و ۶ صبح بیدار می‌شوی/شدی؟',c:'#fda4af'}];
const DN=[...new Set(S.map(s=>s.d))];
const N=180,fa=n=>Number(n).toLocaleString('fa-IR'),pf=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});
const D=[];for(let i=0;i<N;i++){const dt=new Date(2026,9,30+i,12),p={};pf.formatToParts(dt).forEach(x=>p[x.type]=x.value);D.push({y:+p.relatedYear||+p.year,m:+p.month,d:+p.day,wd:(dt.getDay()+1)%7,wk:Math.floor((i+6)/7)})}
D.t={y:0,m:1,d:1,wd:0,wk:-1};const M=[];D.forEach((x,i)=>{let g=M[M.length-1];if(!g||g.m!==x.m||g.y!==x.y){g={y:x.y,m:x.m,days:[]};M.push(g)}g.days.push(i)});
let now,T;function calcT(){now=new Date();T=Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.UTC(2026,9,30))/864e5)}calcT();
let data={};try{data=JSON.parse(localStorage.getItem('disc_v1')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('disc_v1',JSON.stringify(data))}catch(e){};cloudScheduleSave()};
const steps=i=>S.filter(s=>!(s.rest&&s.rest.includes(D[i].wd)));
function stat(list){let done=0,tot=0;const per={};DN.forEach(n=>per[n]={d:0,t:0});
list.forEach(i=>{if(i>T)return;const r=data[i]||{};steps(i).forEach(s=>{const a=r[s.id]!==undefined;if(i<T||a){tot++;per[s.d].t++;if(r[s.id]===1){done++;per[s.d].d++}}})});
return{done,tot,per,pct:tot?Math.round(done/tot*100):null}}
const P=v=>v==null?'—':fa(v)+'٪';
function dots(i,big){const r=data[i]||{};return '<div class="dots'+(big?' big':'')+'">'+steps(i).map(s=>{const v=r[s.id];return v===1?`<span class="dot" style="border-color:${s.c};background:${s.c}"></span>`:v===0?`<span class="dot no">✕</span>`:`<span class="dot" style="border-color:${s.c}"></span>`}).join('')+'</div>'}
let st=[{v:'home'}];const cur=()=>st[st.length-1];
function go(o){st.push(o);render();scrollTo(0,0)}function back(){if(st.length>1)st.pop();render()}
const bar=p=>`<div class="bar"><i style="width:${p||0}%"></i></div>`;
function dayName(i){if(i==='t')return 'روز تست';const x=D[i];return WN[x.wd]+' '+fa(x.d)+' '+MN[x.m-1]}
function monthText(g){const s=stat(g.days);if(!s.tot)return 'هنوز دیتایی برای این ماه ثبت نشده. از اولین روز شروع کن، بقیه‌اش خودش درست می‌شود.';
const arr=DN.filter(n=>s.per[n].t).map(n=>({n,p:Math.round(s.per[n].d/s.per[n].t*100)})).sort((a,b)=>b.p-a.p);
const hi=arr.filter(a=>a.p>=80),lo=arr.filter(a=>a.p<60).reverse();
let t=s.pct>=85?'این ماه واقعاً عالی بودی؛ نظم‌ات جدی و قابل‌اعتماد است.':s.pct>=65?'ماه خوبی بود، ولی هنوز جا برای پیشرفت داری.':s.pct>=40?'ماه متوسطی بود؛ شروع کرده‌ای و حالا باید پایدارتر شوی.':'این ماه سخت گذشت، اما مهم این است که ادامه بدهی و دوباره شروع کنی.';
